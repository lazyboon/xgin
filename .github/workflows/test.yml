name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test with race detection
        run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...
      - name: Test without MessagePack
        run: go test -race -shuffle=on -count=1 -tags nomsgpack ./...

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
